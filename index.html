<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR CLASSES - Login Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 1000px;
        }
        .header {
            text-align: center;
            marginbottom: 50px;
            color: white;
        }
        .header-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .logo {
            height: 80px;
            width: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #2a5298;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .header h1 {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 16px;
            margin-top: 10px;
            opacity: 0.95;
        }
        .login-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }
        .login-card.admin { border-top: 5px solid #1e3c72; }
        .login-card.faculty { border-top: 5px solid #2a5298; }
        .login-card.student { border-top: 5px solid #667eea; }
        .card-icon {
            font-size: 50px;
            text-align: center;
            margin-bottom: 20px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            color: white;
        }
        .admin .card-icon { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); }
        .faculty .card-icon { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .student .card-icon { background: linear-gradient(135deg, #2a5298 0%, #667eea 100%); }
        .card-title {
            font-size: 24px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 5px;
        }
        .card-subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.2);
        }
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 8px rgba(42, 82, 152, 0.2);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            margin-top: 10px;
        }
        .admin .login-btn {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        .faculty .login-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .student .login-btn {
            background: linear-gradient(135deg, #2a5298 0%, #667eea 100%);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
        }
        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #999;
        }
        .signup-link a {
            color: #2a5298;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .signup-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 768px) {
            .header h1 { font-size: 24px; }
            .header-content { flex-direction: column; gap: 10px; }
            .logo { height: 60px; width: 60px; }
            .login-grid {
                grid-template-columns: 1fr;
                gap: 20px;
                margin-top: 30px;
            }
            .login-card { padding: 20px; }
            .card-icon { font-size: 40px; height: 60px; }
            .card-title { font-size: 20px; }
        }
        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #fadbd8;
            border-radius: 6px;
            display: none;
        }
        .success-message {
            color: #27ae60;
            font-size: 13px;
            margin-top: 10px;
            padding: 10px;
            background: #d5f4e6;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-content">
            <div class="logo">AR</div>
            <div>
                <h1>AR CLASSES</h1>
                <p>UNLOCK YOUR POTENTIAL</p>
            </div>
        </div>
    </div>

    <div class="login-grid">
        <!-- ADMIN LOGIN -->
        <div class="login-card admin">
            <div class="card-icon">
                <i class="fas fa-crown"></i>
            </div>
            <div class="card-title">Admin Login</div>
            <div class="card-subtitle">Manage students, faculty & records</div>
            <form id="adminForm" onsubmit="loginAdmin(event)">
                <div class="form-group">
                    <label>Admin Email</label>
                    <input type="text" id="adminUser" placeholder="Enter admin email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="adminPass" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <div class="error-message" id="adminError"></div>
            </form>
            <div class="signup-link">Contact system administrator for access</div>
        </div>

        <!-- FACULTY LOGIN -->
        <div class="login-card faculty">
            <div class="card-icon">
                <i class="fas fa-chalkboard-user"></i>
            </div>
            <div class="card-title">Faculty Login</div>
            <div class="card-subtitle">Manage classes & students</div>
            <form id="facultyForm" onsubmit="loginFaculty(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="facultyName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="facultyContact" placeholder="Enter contact number" maxlength="10" required>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <div class="error-message" id="facultyError"></div>
            </form>
            <div class="signup-link"><a onclick="window.location.href='faculty.html'">Register here</a> if new</div>
        </div>

        <!-- STUDENT LOGIN -->
        <div class="login-card student">
            <div class="card-icon">
                <i class="fas fa-user-graduate"></i>
            </div>
            <div class="card-title">Student Login</div>
            <div class="card-subtitle">View notes & attendance</div>
            <form id="studentForm" onsubmit="loginStudent(event)">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter your student ID (AR...)" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="studentPass" placeholder="Enter password" required>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
                <div class="error-message" id="studentError"></div>
            </form>
            <div class="signup-link"><a onclick="window.location.href='student.html'">Register here</a> if new</div>
        </div>
    </div>

    <!-- FACULTY REGISTRATION MODAL -->
    <div id="facultyRegisterModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:15px; max-width:500px; width:90%;">
            <h2>Faculty Registration</h2>
            <form onsubmit="registerFacultyFromIndex(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regFacultyName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Qualification</label>
                    <input type="text" id="regFacultyQualification" placeholder="e.g., B.Tech CSE" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="regFacultyContact" placeholder="10 digit number" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Email (Optional)</label>
                    <input type="email" id="regFacultyEmail" placeholder="your.email@school.com">
                </div>
                <button type="submit" class="login-btn">Register & Go to Faculty Panel</button>
                <button type="button" class="login-btn" onclick="closeModal('facultyRegisterModal')" style="background:#999; margin-top:10px;">Cancel</button>
            </form>
        </div>
    </div>

    <!-- STUDENT REGISTRATION MODAL -->
    <div id="studentRegisterModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:40px; border-radius:15px; max-width:500px; width:90%; max-height:90vh; overflow-y:auto;">
            <h2>Student Registration</h2>
            <form onsubmit="registerStudentFromIndex(event)">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="regStudentFirstName" placeholder="Enter first name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="regStudentLastName" placeholder="Enter last name" required>
                </div>
                <div class="form-group">
                    <label>School Name</label>
                    <input type="text" id="regStudentSchool" placeholder="School name" required>
                </div>
                <div class="form-group">
                    <label>Guardian Name</label>
                    <input type="text" id="regStudentGuardian" placeholder="Parent/Guardian name" required>
                </div>
                <div class="form-group">
                    <label>Guardian Mobile</label>
                    <input type="tel" id="regStudentGuardianMobile" placeholder="10 digit number" maxlength="10" required>
                </div>
                <div class="form-group">
                    <label>Class</label>
                    <select id="regStudentClass" required>
                        <option value="">Select Class</option>
                        <option>4th</option><option>5th</option><option>6th</option>
                        <option>7th</option><option>8th</option>
                        <option>9th</option><option>10th</option>
                        <option>11th</option><option>12th</option>
                    </select>
                </div>
                <button type="submit" class="login-btn">Register & Go to Student Panel</button>
                <button type="button" class="login-btn" onclick="closeModal('studentRegisterModal')" style="background:#999; margin-top:10px;">Cancel</button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://kgijlxshajimjbqcrygg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1ujAiqxV8MEd0E3SWEIrlQ_EQjM8edG";
let supabaseClient = null;

async function ensureSupabaseClient() {
    if (supabaseClient) return supabaseClient;

    if (!window.supabase || !window.supabase.createClient) {
        await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = 'https://unpkg.com/@supabase/supabase-js@2';
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
        });
    }

    if (!window.supabase || !window.supabase.createClient) {
        throw new Error('Supabase library failed to load. Check internet connection.');
    }

    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    return supabaseClient;
}
</script>

<script>
async function getSupabaseProfile() {
    const sb = await ensureSupabaseClient();
    const { data: sessionData } = await sb.auth.getSession();
    const user = sessionData && sessionData.session ? sessionData.session.user : null;
    if (!user) return null;

    const { data: profile, error } = await sb
        .from('profiles')
        .select('id, role, full_name')
        .eq('id', user.id)
        .single();

    if (error) return null;
    return { user, profile };
}

// ADMIN LOGIN
async function loginAdmin(e) {
    if (e && typeof e.preventDefault === 'function') {
        e.preventDefault();
    }
    let user = document.getElementById('adminUser').value.trim();
    let pass = document.getElementById('adminPass').value;
    let errorDiv = document.getElementById('adminError');

    errorDiv.style.display = 'none';
    if(!user || !pass) {
        errorDiv.textContent = 'Invalid admin credentials';
        errorDiv.style.display = 'block';
        return;
    }

    try {
        const sb = await ensureSupabaseClient();

        const { error: signInError } = await sb.auth.signInWithPassword({
            email: user,
            password: pass
        });

        if(signInError) {
            errorDiv.textContent = signInError.message || 'Admin login failed';
            errorDiv.style.display = 'block';
            return;
        }
    } catch (err) {
        errorDiv.textContent = (err && err.message) ? err.message : 'Unexpected login error';
        errorDiv.style.display = 'block';
        return;
    }

    localStorage.setItem('adminAuth', JSON.stringify({authenticated: true, user: user}));
    window.location.href = 'admin.html';
}
// FACULTY LOGIN
async function loginFaculty(e) {
    if(e && e.preventDefault) e.preventDefault();
    let name = document.getElementById('facultyName').value.trim();
    let contact = document.getElementById('facultyContact').value.trim();
    let errorDiv = document.getElementById('facultyError');
    errorDiv.style.display = 'none';

    if(!name || !contact){
        errorDiv.textContent = 'Please enter name and contact';
        errorDiv.style.display = 'block';
        return;
    }

    const { data, error } = await supabase
        .from('faculty')
        .select('*')
        .eq('contact', contact);

    if(error){
        errorDiv.textContent = error.message || 'Login failed';
        errorDiv.style.display = 'block';
        return;
    }

    const rows = data || [];
    const exact = rows.find(f => (f.name || '').toLowerCase() === name.toLowerCase());

    if(!exact){
        errorDiv.textContent = 'Faculty not found. Please register first';
        errorDiv.style.display = 'block';
        return;
    }

    if(exact.status !== 'approved'){
        errorDiv.textContent = 'Faculty pending admin approval or rejected';
        errorDiv.style.display = 'block';
        return;
    }

    const user = {
        ...exact,
        row_id: exact.id,
        id: exact.faculty_code || '',
        password: exact.password_legacy || ''
    };

    localStorage.setItem('currentFaculty', JSON.stringify(user));
    localStorage.setItem('facultyAuth', JSON.stringify({authenticated: true}));
    window.location.href = 'faculty.html';
}
// STUDENT LOGIN
async function loginStudent(e) {
    if(e && e.preventDefault) e.preventDefault();
    let id = document.getElementById('studentId').value.trim();
    let pass = document.getElementById('studentPass').value;
    let errorDiv = document.getElementById('studentError');
    errorDiv.style.display = 'none';

    if(!id || !pass){
        errorDiv.textContent = 'Please enter ID and password';
        errorDiv.style.display = 'block';
        return;
    }

    const { data, error } = await supabase
        .from('students')
        .select('*')
        .eq('student_code', id)
        .eq('password_legacy', pass)
        .limit(1);

    if(error){
        errorDiv.textContent = error.message || 'Login failed';
        errorDiv.style.display = 'block';
        return;
    }

    const userRow = (data || [])[0];
    if(!userRow){
        errorDiv.textContent = 'Invalid ID or password';
        errorDiv.style.display = 'block';
        return;
    }

    if(userRow.status !== 'approved'){
        errorDiv.textContent = 'Not approved by admin yet';
        errorDiv.style.display = 'block';
        return;
    }

    const user = {
        ...userRow,
        row_id: userRow.id,
        id: userRow.student_code || '',
        password: userRow.password_legacy || '',
        firstName: userRow.first_name || '',
        lastName: userRow.last_name || '',
        guardianMobile: userRow.guardian_mobile || ''
    };

    localStorage.setItem('currentStudent', JSON.stringify(user));
    localStorage.setItem('studentAuth', JSON.stringify({authenticated: true}));
    window.location.href = 'student.html';
}
// MODAL FUNCTIONS
function showFacultyRegister() {
    document.getElementById('facultyRegisterModal').style.display = 'flex';
}

function showStudentRegister() {
    document.getElementById('studentRegisterModal').style.display = 'flex';
}

function closeModal(modalId) {
    document.getElementById(modalId).style.display = 'none';
}

// Close modal when clicking outside
window.onclick = function(event) {
    let facultyModal = document.getElementById('facultyRegisterModal');
    let studentModal = document.getElementById('studentRegisterModal');
    if(event.target === facultyModal) {
        facultyModal.style.display = 'none';
    }
    if(event.target === studentModal) {
        studentModal.style.display = 'none';
    }
}

// FACULTY REGISTRATION FROM INDEX
async function registerFacultyFromIndex(e) {
    e.preventDefault();
    let name = document.getElementById('regFacultyName').value.trim();
    let qualification = document.getElementById('regFacultyQualification').value.trim();
    let contact = document.getElementById('regFacultyContact').value.trim();
    let email = document.getElementById('regFacultyEmail').value.trim();

    if(!name || !qualification || !contact) {
        alert('Please fill all required fields');
        return;
    }

    if(contact.length !== 10) {
        alert('Contact must be 10 digits');
        return;
    }

    const { data: existing, error: findError } = await supabase
        .from('faculty')
        .select('id,name,contact')
        .eq('contact', contact);

    if(findError){
        alert('Registration failed: ' + findError.message);
        return;
    }

    const exists = (existing || []).find(f => (f.name || '').toLowerCase() === name.toLowerCase());
    if(exists) {
        alert('Faculty already registered with this name and contact');
        return;
    }

    const { error: insertError } = await supabase.from('faculty').insert({
        name: name,
        qualification: qualification,
        contact: contact,
        email: email,
        subjects: [],
        classes: [],
        status: 'pending'
    });

    if(insertError){
        alert('Registration failed: ' + insertError.message);
        return;
    }

    closeModal('facultyRegisterModal');
    alert('Registration successful!\nWait for Admin approval.\n\nRedirecting to Faculty Panel...');
    setTimeout(() => {
        window.location.href = 'faculty.html';
    }, 500);
}
// STUDENT REGISTRATION FROM INDEX
async function registerStudentFromIndex(e) {
    e.preventDefault();
    let firstName = document.getElementById('regStudentFirstName').value.trim();
    let lastName = document.getElementById('regStudentLastName').value.trim();
    let school = document.getElementById('regStudentSchool').value.trim();
    let guardian = document.getElementById('regStudentGuardian').value.trim();
    let guardianMobile = document.getElementById('regStudentGuardianMobile').value.trim();
    let classVal = document.getElementById('regStudentClass').value;

    if(!firstName || !lastName || !school || !guardian || !guardianMobile || !classVal) {
        alert('Please fill all required fields');
        return;
    }

    if(guardianMobile.length !== 10) {
        alert('Guardian mobile must be 10 digits');
        return;
    }

    const { error } = await supabase.from('students').insert({
        first_name: firstName,
        last_name: lastName,
        school: school,
        guardian: guardian,
        guardian_mobile: guardianMobile,
        class: classVal,
        subjects: [],
        monthly_fee: 0,
        course_fee: 0,
        status: 'pending'
    });

    if(error){
        alert('Registration failed: ' + error.message);
        return;
    }

    closeModal('studentRegisterModal');
    alert('Registration Successful!\n\nYour application is pending admin approval.\nAdmin will assign your Student ID and Password.\n\nRedirecting to Student Panel...');
    setTimeout(() => {
        window.location.href = 'student.html';
    }, 500);
}
function showAlert() {
    alert('Please register through your respective panel first!\\n\\n' +
          '👨‍🎓 Students: Register in the Student Panel\\n' +
          '👨‍🏫 Faculty: Register in the Faculty Panel');
}

// Check if already logged in
window.addEventListener('load', async function() {
    if(localStorage.getItem('adminAuth')) {
        window.location.href = 'admin.html';
        return;
    }
    if(localStorage.getItem('facultyAuth') && localStorage.getItem('currentFaculty')) {
        window.location.href = 'faculty.html';
        return;
    }
    if(localStorage.getItem('studentAuth') && localStorage.getItem('currentStudent')) {
        window.location.href = 'student.html';
    }
});
</script>

</body>
</html>
